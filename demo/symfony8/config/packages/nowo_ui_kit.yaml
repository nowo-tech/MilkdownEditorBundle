# REQ-DEMO-014: UiKit's default theme, unchanged, with UiKit's own semantic stylesheet only (no CSS framework, no CDN).
nowo_ui_kit:
    css_framework: custom
    icon_set: none
    # UiKit's opt-in default theme (2.51): the page canvas and the Dark view (`?theme=dark`) come from UiKit, not demo CSS.
    base_stylesheet: true
