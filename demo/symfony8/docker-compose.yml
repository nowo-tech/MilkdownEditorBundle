name: milkdown-editor-bundle-demo-symfony-8

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milkdown-editor-demo-symfony8-php
    working_dir: /app
    ports:
      - "${PORT:-8187}:80"
    volumes:
      - .:/app
      - ../..:/var/milkdown-editor-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=${APP_ENV:-dev}
      - APP_DEBUG=${APP_DEBUG:-1}
      - APP_SECRET=${APP_SECRET:-demo-secret}
      - FRANKENPHP_MODE=${FRANKENPHP_MODE:-worker}
      - DEFAULT_URI=${DEFAULT_URI:-http://localhost:8187}
    # Mitigate Docker/WSL DNS failures resolving repo.packagist.org (composer curl error 6).
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - milkdown-editor-demo-network

volumes:
  composer-cache:
    driver: local

networks:
  milkdown-editor-demo-network:
    driver: bridge
